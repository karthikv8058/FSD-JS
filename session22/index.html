<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Session 22 - Product Feedback App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">

    <div class="container">
        <div class="card shadow-sm p-4">
            <h2 class="text-primary mb-3">🛒 Product Feedback App</h2>

            <button id="load-btn" class="btn btn-primary mb-3">
                Load Products
            </button>

            <div id="products" class="mb-4"></div>

            <form id="feedback-form">
                <div class="mb-3">
                    <input type="text" id="name" class="form-control" placeholder="Your Name" required>
                </div>

                <div class="mb-3">
                    <textarea id="message" class="form-control" rows="3" placeholder="Your Feedback"
                        required></textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    Send Feedback
                </button>
            </form>

            <div id="result" class="mt-3"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
